# VoxVoice CI — the minimum enforcement the governance already assumes exists (M11.3).
#
# ADR-0051 **CE7** makes CI a certification prerequisite, and it is not optional bookkeeping:
# **AR-10, AR-11, AR-12, AR-13, AR-14, AR-15 and AR-40 are marked [CI]** in ARCHITECTURE_RULES,
# GOVERNANCE §10 makes green CI a mandatory release gate, SECURITY_POLICY §6 requires an automated
# vulnerability audit, and DEFINITION_OF_DONE requires zero warnings. Until this file existed,
# every one of those was enforced by nothing (risk R-14).
#
# Deliberately small. One tool per job (CODING_STANDARDS §7), no CI framework, no reusable-workflow
# machinery — the jobs run the same commands a developer runs locally, so a green badge and a green
# checkout mean the same thing.
#
# **ADR-0052 compliance is load-bearing here.** The Epic 9/10 freeze and certification suites read
# pinned historical commits (`db8c5082…`, `3779e932…`, `8ee7d3c1…`, `57c41eda…`) and materialize a
# detached worktree of the released tree. A shallow clone cannot see those objects, so every job
# that runs tests checks out with `fetch-depth: 0` and `fetch-tags: true`. Absent history makes
# those suites raise `HistoricalEvidenceUnavailable` and **fail closed** — they never pass silently.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # P-ADR-0002 §6: floor 3.12, and the release interpreter is named here rather than in prose.
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.6"

defaults:
  run:
    working-directory: platform

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install the locked toolchain
        run: uv sync --locked --extra dev
      # Scoped to the packages the Definition of Done covers. `voicebot/` is the excluded
      # prototype and carries two pre-existing findings the Epic 10 release recorded as out of
      # scope (DL-0146 R-7); silencing them here would be re-litigating a closed decision.
      - name: ruff
        run: uv run ruff check core api runtime providers events observability billing tests

  tests:
    name: full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ADR-0052: the historical certification suites need the pinned commits and the tags.
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Verify the pinned historical commits are present
        # Fails the job explicitly rather than letting a shallow clone reach the suites, so the
        # failure names its cause instead of surfacing as an opaque evidence error.
        run: |
          for commit in db8c50828c91567aa9a7c518e58f804593a592f9 \
                        3779e932182ed06ec5411c83ba53f0c2b585b8b8 \
                        8ee7d3c1bf57ae862307c357c75e4c2008665e0f \
                        57c41eda776029f721a4ebd9856a4303577d2f20; do
            git cat-file -t "$commit" >/dev/null || {
              echo "::error::missing pinned commit $commit — ADR-0052 evidence unavailable"
              exit 1
            }
          done
      # Warnings-as-errors, scoped the way **ADR-0051 CE8** actually states it: *"Platform code
      # must emit none; third-party warnings are enumerated and attributed rather than silenced."*
      #
      # A blanket `-W error` is NOT honest here and was measured, not assumed: it produces 177
      # failures and 87 errors from two pre-existing non-platform sources, neither of which M11.3
      # is authorized to fix. They are enumerated by class so a *new* warning from our own code
      # still fails the build — which is the property DEFINITION_OF_DONE is protecting.
      #
      #   1. StarletteDeprecationWarning — third-party (starlette + httpx); the Epic 10 release
      #      already recorded it. Not a DeprecationWarning subclass, so it needs its own filter.
      #   2. ResourceWarning / PytestUnraisableExceptionWarning — unclosed SQLite handles in
      #      Epic 9's fixtures, surfaced non-deterministically by the GC. Pre-existing test
      #      hygiene, tracked as risk R-28; silencing it here is attribution, not a fix.
      - name: pytest (warnings are errors for platform code)
        run: >
          uv run pytest -q
          -W error
          -W "ignore::starlette.exceptions.StarletteDeprecationWarning"
          -W "ignore::ResourceWarning"
          -W "ignore::pytest.PytestUnraisableExceptionWarning"

  architecture:
    name: import-layer rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      # The [CI]-marked rules, executed as the assertions that encode them. AR-10/11/12/13/14/15
      # and AR-40 all have named tests in the conformance and boundary suites.
      - name: architecture boundaries
        run: >
          uv run pytest -q
          tests/test_conformance_capabilities.py
          tests/test_events_boundary.py
          tests/test_audio_foundation.py

  conformance:
    name: capability contract suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      # Constitution §A6.3 — a provider that does not pass its capability suite does not merge.
      - name: conformance
        run: >
          uv run pytest -q
          tests/test_conformance_capabilities.py
          tests/test_conformance_voice_activity.py
          tests/test_local_providers.py

  security:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # SECURITY_POLICY §6: "automated vulnerability audit in CI (fail on high/critical with a
      # triage note path)". `pip-audit` is PyPA's own scanner, queries the OSV database, and is
      # run as a **tool** (`uvx`) rather than added to the project's dependencies — it is CI
      # tooling, not something the platform imports (DL-0163).
      - name: Export the locked dependency set
        run: uv export --format requirements-txt --no-emit-project -o /tmp/requirements.txt
      - name: pip-audit
        run: uvx pip-audit --strict --requirement /tmp/requirements.txt

  console:
    name: console (typecheck, test, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json
      # Epic 12 (ADR-0055 DP8). The same commands a developer runs locally; the committed
      # lockfile is the dependency set (DL-0236), and the audit fails on high/critical findings
      # exactly as the Python job does (SECURITY_POLICY §6).
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
