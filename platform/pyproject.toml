[project]
name = "voxvoice-platform"
version = "0.1.0"
description = "Self-hostable, context-driven voice-agent platform (Vapi alternative). Phase 1: API in front."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

# Run everything from inside platform/ so the top-level packages are
# `api`, `adapters`, `webhooks`, `tests`. NOTE: the directory is intentionally
# named `platform` per SPEC §8, but it is the project root, *not* a Python
# package — that avoids shadowing the stdlib `platform` module.
[tool.setuptools]
packages = ["api", "adapters", "webhooks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI relies on `Depends()`/`Header()` as argument defaults — idiomatic, not a bug.
ignore = ["B008"]
